<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 160" role="img" aria-label="Cause-controlled regulator: D to S and A, both to Z">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#222"/>
    </marker>
  </defs>
  <text x="170" y="18" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333">Cause-controlled</text>
  <circle cx="40" cy="80" r="18" fill="#f7f7f7" stroke="#222" stroke-width="1.5"/>
  <text x="40" y="85" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-style="italic">D</text>
  <circle cx="160" cy="40" r="18" fill="#f7f7f7" stroke="#222" stroke-width="1.5"/>
  <text x="160" y="45" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-style="italic">S</text>
  <circle cx="160" cy="120" r="18" fill="#f7f7f7" stroke="#222" stroke-width="1.5"/>
  <text x="160" y="125" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-style="italic">A</text>
  <circle cx="280" cy="80" r="18" fill="#f7f7f7" stroke="#222" stroke-width="1.5"/>
  <text x="280" y="85" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-style="italic">Z</text>
  <line x1="56" y1="70" x2="142" y2="48" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="56" y1="90" x2="142" y2="112" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="178" y1="48" x2="262" y2="70" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="178" y1="112" x2="262" y2="90" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="40" y="152" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#555">disturbance</text>
  <text x="160" y="22" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#555">system</text>
  <text x="160" y="152" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#555">action</text>
  <text x="280" y="152" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#555">reguland</text>
</svg>
