<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420">
  <!--
    Both cups are identical in size (200px wide, same U-shape).
    Both use the same 6-column grid, 28px step, fruit radius 11.
    Fruit rows are bottom-aligned: bottom row at y=225, stepping up by 28.
    Barrel 1 (4 rows): y = 141, 169, 197, 225
    Barrel 2 (2 rows): y = 197, 225
    Col x positions:
      Cup 1 (centre 220): 148, 176, 204, 232, 260, 288
      Cup 2 (centre 680): 608, 636, 664, 692, 720, 748
  -->
  <defs>
    <clipPath id="b1clip">
      <rect x="120" y="75" width="200" height="175"/>
    </clipPath>
    <clipPath id="b2clip">
      <rect x="580" y="75" width="200" height="175"/>
    </clipPath>
  </defs>

  <!-- =========================================================
       CUP ONE  (centre x=220)
       20 apples + 4 oranges, 4 rows × 6 cols
       row 0-2: all apples; row 3: 2 apples + 4 oranges
  ========================================================= -->

  <path d="M 120,80 L 120,245 C 170,262 270,262 320,245 L 320,80 Z"
        fill="#EDD9A3" stroke="none"/>

  <!-- row 0, y=141 — all apples -->
  <circle cx="148" cy="141" r="11" fill="#CC2222" stroke="#881414" stroke-width="1" clip-path="url(#b1clip)"/>
  <circle cx="176" cy="141" r="11" fill="#CC2222" stroke="#881414" stroke-width="1" clip-path="url(#b1clip)"/>
  <circle cx="204" cy="141" r="11" fill="#CC2222" stroke="#881414" stroke-width="1" clip-path="url(#b1clip)"/>
  <circle cx="232" cy="141" r="11" fill="#CC2222" stroke="#881414" stroke-width="1" clip-path="url(#b1clip)"/>
  <circle cx="260" cy="141" r="11" fill="#CC2222" stroke="#881414" stroke-width="1" clip-path="url(#b1clip)"/>
  <circle cx="288" cy="141" r="11" fill="#CC2222" stroke="#881414" stroke-width="1" clip-path="url(#b1clip)"/>
  <line x1="148" y1="130" x2="150" y2="125" stroke="#5A3010" stroke-width="2" clip-path="url(#b1clip)"/>
  <line x1="176" y1="130" x2="178" y2="125" stroke="#5A3010" stroke-width="2" clip-path="url(#b1clip)"/>
  <line x1="204" y1="130" x2="206" y2="125" stroke="#5A3010" stroke-width="2" clip-path="url(#b1clip)"/>
  <line x1="232" y1="130" x2="234" y2="125" stroke="#5A3010" stroke-width="2" clip-path="url(#b1clip)"/>
  <line x1="260" y1="130" x2="262" y2="125" stroke="#5A3010" stroke-width="2" clip-path="url(#b1clip)"/>
  <line x1="288" y1="130" x2="290" y2="125" stroke="#5A3010" stroke-width="2" clip-path="url(#b1clip)"/>

  <!-- row 1, y=169 — all apples -->
  <circle cx="148" cy="169" r="11" fill="#CC2222" stroke="#881414" stroke-width="1" clip-path="url(#b1clip)"/>
  <circle cx="176" cy="169" r="11" fill="#CC2222" stroke="#881414" stroke-width="1" clip-path="url(#b1clip)"/>
  <circle cx="204" cy="169" r="11" fill="#CC2222" stroke="#881414" stroke-width="1" clip-path="url(#b1clip)"/>
  <circle cx="232" cy="169" r="11" fill="#CC2222" stroke="#881414" stroke-width="1" clip-path="url(#b1clip)"/>
  <circle cx="260" cy="169" r="11" fill="#CC2222" stroke="#881414" stroke-width="1" clip-path="url(#b1clip)"/>
  <circle cx="288" cy="169" r="11" fill="#CC2222" stroke="#881414" stroke-width="1" clip-path="url(#b1clip)"/>
  <line x1="148" y1="158" x2="150" y2="153" stroke="#5A3010" stroke-width="2" clip-path="url(#b1clip)"/>
  <line x1="176" y1="158" x2="178" y2="153" stroke="#5A3010" stroke-width="2" clip-path="url(#b1clip)"/>
  <line x1="204" y1="158" x2="206" y2="153" stroke="#5A3010" stroke-width="2" clip-path="url(#b1clip)"/>
  <line x1="232" y1="158" x2="234" y2="153" stroke="#5A3010" stroke-width="2" clip-path="url(#b1clip)"/>
  <line x1="260" y1="158" x2="262" y2="153" stroke="#5A3010" stroke-width="2" clip-path="url(#b1clip)"/>
  <line x1="288" y1="158" x2="290" y2="153" stroke="#5A3010" stroke-width="2" clip-path="url(#b1clip)"/>

  <!-- row 2, y=197 — all apples -->
  <circle cx="148" cy="197" r="11" fill="#CC2222" stroke="#881414" stroke-width="1" clip-path="url(#b1clip)"/>
  <circle cx="176" cy="197" r="11" fill="#CC2222" stroke="#881414" stroke-width="1" clip-path="url(#b1clip)"/>
  <circle cx="204" cy="197" r="11" fill="#CC2222" stroke="#881414" stroke-width="1" clip-path="url(#b1clip)"/>
  <circle cx="232" cy="197" r="11" fill="#CC2222" stroke="#881414" stroke-width="1" clip-path="url(#b1clip)"/>
  <circle cx="260" cy="197" r="11" fill="#CC2222" stroke="#881414" stroke-width="1" clip-path="url(#b1clip)"/>
  <circle cx="288" cy="197" r="11" fill="#CC2222" stroke="#881414" stroke-width="1" clip-path="url(#b1clip)"/>
  <line x1="148" y1="186" x2="150" y2="181" stroke="#5A3010" stroke-width="2" clip-path="url(#b1clip)"/>
  <line x1="176" y1="186" x2="178" y2="181" stroke="#5A3010" stroke-width="2" clip-path="url(#b1clip)"/>
  <line x1="204" y1="186" x2="206" y2="181" stroke="#5A3010" stroke-width="2" clip-path="url(#b1clip)"/>
  <line x1="232" y1="186" x2="234" y2="181" stroke="#5A3010" stroke-width="2" clip-path="url(#b1clip)"/>
  <line x1="260" y1="186" x2="262" y2="181" stroke="#5A3010" stroke-width="2" clip-path="url(#b1clip)"/>
  <line x1="288" y1="186" x2="290" y2="181" stroke="#5A3010" stroke-width="2" clip-path="url(#b1clip)"/>

  <!-- row 3, y=225 — cols 0-1 apple, cols 2-5 orange -->
  <circle cx="148" cy="225" r="11" fill="#CC2222" stroke="#881414" stroke-width="1" clip-path="url(#b1clip)"/>
  <circle cx="176" cy="225" r="11" fill="#CC2222" stroke="#881414" stroke-width="1" clip-path="url(#b1clip)"/>
  <line x1="148" y1="214" x2="150" y2="209" stroke="#5A3010" stroke-width="2" clip-path="url(#b1clip)"/>
  <line x1="176" y1="214" x2="178" y2="209" stroke="#5A3010" stroke-width="2" clip-path="url(#b1clip)"/>
  <circle cx="204" cy="225" r="11" fill="#FF8800" stroke="#CC5500" stroke-width="1" clip-path="url(#b1clip)"/>
  <circle cx="232" cy="225" r="11" fill="#FF8800" stroke="#CC5500" stroke-width="1" clip-path="url(#b1clip)"/>
  <circle cx="260" cy="225" r="11" fill="#FF8800" stroke="#CC5500" stroke-width="1" clip-path="url(#b1clip)"/>
  <circle cx="288" cy="225" r="11" fill="#FF8800" stroke="#CC5500" stroke-width="1" clip-path="url(#b1clip)"/>

  <!-- cup border -->
  <path d="M 120,80 L 120,245 C 170,262 270,262 320,245 L 320,80"
        fill="none" stroke="#8B6520" stroke-width="3" stroke-linejoin="round"/>

  <!-- label and legend -->
  <text x="220" y="282"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="18" font-weight="bold"
        text-anchor="middle" fill="#2A2A2A">Barrel One</text>
  <circle cx="157" cy="304" r="8" fill="#CC2222" stroke="#881414" stroke-width="1"/>
  <line x1="157" y1="296" x2="158" y2="292" stroke="#5A3010" stroke-width="2"/>
  <text x="170" y="309"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="14" fill="#444">20 apples</text>
  <circle cx="157" cy="326" r="8" fill="#FF8800" stroke="#CC5500" stroke-width="1"/>
  <text x="170" y="331"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="14" fill="#444">4 oranges</text>

  <!-- =========================================================
       CUP TWO  (centre x=680)
       4 apples + 8 oranges, 2 rows × 6 cols
       row 0: 4 apples + 2 oranges; row 1: all 6 oranges
  ========================================================= -->

  <path d="M 580,80 L 580,245 C 630,262 730,262 780,245 L 780,80 Z"
        fill="#EDD9A3" stroke="none"/>

  <!-- row 0, y=197 — cols 0-3 apple, cols 4-5 orange -->
  <circle cx="608" cy="197" r="11" fill="#CC2222" stroke="#881414" stroke-width="1" clip-path="url(#b2clip)"/>
  <circle cx="636" cy="197" r="11" fill="#CC2222" stroke="#881414" stroke-width="1" clip-path="url(#b2clip)"/>
  <circle cx="664" cy="197" r="11" fill="#CC2222" stroke="#881414" stroke-width="1" clip-path="url(#b2clip)"/>
  <circle cx="692" cy="197" r="11" fill="#CC2222" stroke="#881414" stroke-width="1" clip-path="url(#b2clip)"/>
  <line x1="608" y1="186" x2="610" y2="181" stroke="#5A3010" stroke-width="2" clip-path="url(#b2clip)"/>
  <line x1="636" y1="186" x2="638" y2="181" stroke="#5A3010" stroke-width="2" clip-path="url(#b2clip)"/>
  <line x1="664" y1="186" x2="666" y2="181" stroke="#5A3010" stroke-width="2" clip-path="url(#b2clip)"/>
  <line x1="692" y1="186" x2="694" y2="181" stroke="#5A3010" stroke-width="2" clip-path="url(#b2clip)"/>
  <circle cx="720" cy="197" r="11" fill="#FF8800" stroke="#CC5500" stroke-width="1" clip-path="url(#b2clip)"/>
  <circle cx="748" cy="197" r="11" fill="#FF8800" stroke="#CC5500" stroke-width="1" clip-path="url(#b2clip)"/>

  <!-- row 1, y=225 — all oranges -->
  <circle cx="608" cy="225" r="11" fill="#FF8800" stroke="#CC5500" stroke-width="1" clip-path="url(#b2clip)"/>
  <circle cx="636" cy="225" r="11" fill="#FF8800" stroke="#CC5500" stroke-width="1" clip-path="url(#b2clip)"/>
  <circle cx="664" cy="225" r="11" fill="#FF8800" stroke="#CC5500" stroke-width="1" clip-path="url(#b2clip)"/>
  <circle cx="692" cy="225" r="11" fill="#FF8800" stroke="#CC5500" stroke-width="1" clip-path="url(#b2clip)"/>
  <circle cx="720" cy="225" r="11" fill="#FF8800" stroke="#CC5500" stroke-width="1" clip-path="url(#b2clip)"/>
  <circle cx="748" cy="225" r="11" fill="#FF8800" stroke="#CC5500" stroke-width="1" clip-path="url(#b2clip)"/>

  <!-- cup border -->
  <path d="M 580,80 L 580,245 C 630,262 730,262 780,245 L 780,80"
        fill="none" stroke="#8B6520" stroke-width="3" stroke-linejoin="round"/>

  <!-- label and legend -->
  <text x="680" y="282"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="18" font-weight="bold"
        text-anchor="middle" fill="#2A2A2A">Barrel Two</text>
  <circle cx="617" cy="304" r="8" fill="#CC2222" stroke="#881414" stroke-width="1"/>
  <line x1="617" y1="296" x2="618" y2="292" stroke="#5A3010" stroke-width="2"/>
  <text x="630" y="309"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="14" fill="#444">4 apples</text>
  <circle cx="617" cy="326" r="8" fill="#FF8800" stroke="#CC5500" stroke-width="1"/>
  <text x="630" y="331"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="14" fill="#444">8 oranges</text>

  <!-- central prompt -->
  <text x="450" y="356"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="15" font-style="italic"
        text-anchor="middle" fill="#666">Choose a barrel at random,</text>
  <text x="450" y="378"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="15" font-style="italic"
        text-anchor="middle" fill="#666">then draw one fruit.</text>

</svg>
