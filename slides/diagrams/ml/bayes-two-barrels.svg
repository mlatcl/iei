<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400">
  <defs>
    <linearGradient id="woodGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7A4A1E"/>
      <stop offset="18%"  stop-color="#C8864A"/>
      <stop offset="50%"  stop-color="#E09A5C"/>
      <stop offset="82%"  stop-color="#C8864A"/>
      <stop offset="100%" stop-color="#7A4A1E"/>
    </linearGradient>
    <linearGradient id="woodGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7A4A1E"/>
      <stop offset="18%"  stop-color="#C8864A"/>
      <stop offset="50%"  stop-color="#E09A5C"/>
      <stop offset="82%"  stop-color="#C8864A"/>
      <stop offset="100%" stop-color="#7A4A1E"/>
    </linearGradient>
    <!-- Clip paths to keep fruits inside each barrel -->
    <clipPath id="b1clip">
      <path d="M 125,70 C 113,162 113,162 125,257 L 315,257 C 327,162 327,162 315,70 Z"/>
    </clipPath>
    <clipPath id="b2clip">
      <path d="M 585,70 C 573,162 573,162 585,257 L 775,257 C 787,162 787,162 775,70 Z"/>
    </clipPath>
  </defs>

  <!-- background -->

  <!-- =========================================================
       BARREL ONE  (centre x = 220)
  ========================================================= -->

  <!-- barrel body: cubic bezier with both control-points at the
       mid-height bulge gives a natural cask silhouette -->
  <path d="M 120,60 C 108,162 108,162 120,265
           L 320,265 C 332,162 332,162 320,60 Z"
        fill="url(#woodGrad1)" stroke="#6B4423" stroke-width="2"/>

  <!-- vertical stave lines -->
  <line x1="152" y1="63" x2="150" y2="262" stroke="#9B5C28" stroke-width="1" opacity="0.55"/>
  <line x1="184" y1="63" x2="182" y2="262" stroke="#9B5C28" stroke-width="1" opacity="0.55"/>
  <line x1="220" y1="63" x2="220" y2="262" stroke="#9B5C28" stroke-width="1" opacity="0.55"/>
  <line x1="256" y1="63" x2="258" y2="262" stroke="#9B5C28" stroke-width="1" opacity="0.55"/>
  <line x1="288" y1="63" x2="290" y2="262" stroke="#9B5C28" stroke-width="1" opacity="0.55"/>

  <!-- metal hoops -->
  <rect x="117" y="82"  width="206" height="9" rx="1" fill="#484848"/>
  <rect x="108" y="157" width="224" height="9" rx="1" fill="#484848"/>
  <rect x="117" y="233" width="206" height="9" rx="1" fill="#484848"/>

  <!-- top rim and dark interior -->
  <ellipse cx="220" cy="60" rx="100" ry="15" fill="#9B6A35" stroke="#6B4423" stroke-width="2"/>
  <ellipse cx="220" cy="60" rx="92"  ry="12" fill="#2A1408" opacity="0.75"/>

  <!-- Fruits in Barrel One: 20 apples + 4 oranges
       4 rows x 6 cols.  Rows 0-2 all apple; row 3: cols 0-1 apple, cols 2-5 orange.
       x = 148, 176, 204, 232, 260, 288  (step 28)
       y = 103, 131, 159, 187            (step 28) -->

  <!-- row 0, y=103, all apples -->
  <circle cx="148" cy="103" r="11" fill="#CC2222" stroke="#881414" stroke-width="1" clip-path="url(#b1clip)"/>
  <circle cx="176" cy="103" r="11" fill="#CC2222" stroke="#881414" stroke-width="1" clip-path="url(#b1clip)"/>
  <circle cx="204" cy="103" r="11" fill="#CC2222" stroke="#881414" stroke-width="1" clip-path="url(#b1clip)"/>
  <circle cx="232" cy="103" r="11" fill="#CC2222" stroke="#881414" stroke-width="1" clip-path="url(#b1clip)"/>
  <circle cx="260" cy="103" r="11" fill="#CC2222" stroke="#881414" stroke-width="1" clip-path="url(#b1clip)"/>
  <circle cx="288" cy="103" r="11" fill="#CC2222" stroke="#881414" stroke-width="1" clip-path="url(#b1clip)"/>
  <!-- stems row 0 -->
  <line x1="148" y1="92" x2="150" y2="87" stroke="#5A3010" stroke-width="2" clip-path="url(#b1clip)"/>
  <line x1="176" y1="92" x2="178" y2="87" stroke="#5A3010" stroke-width="2" clip-path="url(#b1clip)"/>
  <line x1="204" y1="92" x2="206" y2="87" stroke="#5A3010" stroke-width="2" clip-path="url(#b1clip)"/>
  <line x1="232" y1="92" x2="234" y2="87" stroke="#5A3010" stroke-width="2" clip-path="url(#b1clip)"/>
  <line x1="260" y1="92" x2="262" y2="87" stroke="#5A3010" stroke-width="2" clip-path="url(#b1clip)"/>
  <line x1="288" y1="92" x2="290" y2="87" stroke="#5A3010" stroke-width="2" clip-path="url(#b1clip)"/>

  <!-- row 1, y=131, all apples -->
  <circle cx="148" cy="131" r="11" fill="#CC2222" stroke="#881414" stroke-width="1" clip-path="url(#b1clip)"/>
  <circle cx="176" cy="131" r="11" fill="#CC2222" stroke="#881414" stroke-width="1" clip-path="url(#b1clip)"/>
  <circle cx="204" cy="131" r="11" fill="#CC2222" stroke="#881414" stroke-width="1" clip-path="url(#b1clip)"/>
  <circle cx="232" cy="131" r="11" fill="#CC2222" stroke="#881414" stroke-width="1" clip-path="url(#b1clip)"/>
  <circle cx="260" cy="131" r="11" fill="#CC2222" stroke="#881414" stroke-width="1" clip-path="url(#b1clip)"/>
  <circle cx="288" cy="131" r="11" fill="#CC2222" stroke="#881414" stroke-width="1" clip-path="url(#b1clip)"/>
  <!-- stems row 1 -->
  <line x1="148" y1="120" x2="150" y2="115" stroke="#5A3010" stroke-width="2" clip-path="url(#b1clip)"/>
  <line x1="176" y1="120" x2="178" y2="115" stroke="#5A3010" stroke-width="2" clip-path="url(#b1clip)"/>
  <line x1="204" y1="120" x2="206" y2="115" stroke="#5A3010" stroke-width="2" clip-path="url(#b1clip)"/>
  <line x1="232" y1="120" x2="234" y2="115" stroke="#5A3010" stroke-width="2" clip-path="url(#b1clip)"/>
  <line x1="260" y1="120" x2="262" y2="115" stroke="#5A3010" stroke-width="2" clip-path="url(#b1clip)"/>
  <line x1="288" y1="120" x2="290" y2="115" stroke="#5A3010" stroke-width="2" clip-path="url(#b1clip)"/>

  <!-- row 2, y=159, all apples -->
  <circle cx="148" cy="159" r="11" fill="#CC2222" stroke="#881414" stroke-width="1" clip-path="url(#b1clip)"/>
  <circle cx="176" cy="159" r="11" fill="#CC2222" stroke="#881414" stroke-width="1" clip-path="url(#b1clip)"/>
  <circle cx="204" cy="159" r="11" fill="#CC2222" stroke="#881414" stroke-width="1" clip-path="url(#b1clip)"/>
  <circle cx="232" cy="159" r="11" fill="#CC2222" stroke="#881414" stroke-width="1" clip-path="url(#b1clip)"/>
  <circle cx="260" cy="159" r="11" fill="#CC2222" stroke="#881414" stroke-width="1" clip-path="url(#b1clip)"/>
  <circle cx="288" cy="159" r="11" fill="#CC2222" stroke="#881414" stroke-width="1" clip-path="url(#b1clip)"/>
  <!-- stems row 2 -->
  <line x1="148" y1="148" x2="150" y2="143" stroke="#5A3010" stroke-width="2" clip-path="url(#b1clip)"/>
  <line x1="176" y1="148" x2="178" y2="143" stroke="#5A3010" stroke-width="2" clip-path="url(#b1clip)"/>
  <line x1="204" y1="148" x2="206" y2="143" stroke="#5A3010" stroke-width="2" clip-path="url(#b1clip)"/>
  <line x1="232" y1="148" x2="234" y2="143" stroke="#5A3010" stroke-width="2" clip-path="url(#b1clip)"/>
  <line x1="260" y1="148" x2="262" y2="143" stroke="#5A3010" stroke-width="2" clip-path="url(#b1clip)"/>
  <line x1="288" y1="148" x2="290" y2="143" stroke="#5A3010" stroke-width="2" clip-path="url(#b1clip)"/>

  <!-- row 3, y=187: cols 0-1 apple, cols 2-5 orange -->
  <circle cx="148" cy="187" r="11" fill="#CC2222" stroke="#881414" stroke-width="1" clip-path="url(#b1clip)"/>
  <circle cx="176" cy="187" r="11" fill="#CC2222" stroke="#881414" stroke-width="1" clip-path="url(#b1clip)"/>
  <line x1="148" y1="176" x2="150" y2="171" stroke="#5A3010" stroke-width="2" clip-path="url(#b1clip)"/>
  <line x1="176" y1="176" x2="178" y2="171" stroke="#5A3010" stroke-width="2" clip-path="url(#b1clip)"/>
  <circle cx="204" cy="187" r="11" fill="#FF8800" stroke="#CC5500" stroke-width="1" clip-path="url(#b1clip)"/>
  <circle cx="232" cy="187" r="11" fill="#FF8800" stroke="#CC5500" stroke-width="1" clip-path="url(#b1clip)"/>
  <circle cx="260" cy="187" r="11" fill="#FF8800" stroke="#CC5500" stroke-width="1" clip-path="url(#b1clip)"/>
  <circle cx="288" cy="187" r="11" fill="#FF8800" stroke="#CC5500" stroke-width="1" clip-path="url(#b1clip)"/>

  <!-- Barrel One label and legend -->
  <text x="220" y="290"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="18" font-weight="bold"
        text-anchor="middle" fill="#2A2A2A">Barrel One</text>
  <circle cx="157" cy="314" r="8" fill="#CC2222" stroke="#881414" stroke-width="1"/>
  <line x1="157" y1="306" x2="158" y2="302" stroke="#5A3010" stroke-width="2"/>
  <text x="170" y="319"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="14" fill="#444">20 apples</text>
  <circle cx="157" cy="338" r="8" fill="#FF8800" stroke="#CC5500" stroke-width="1"/>
  <text x="170" y="343"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="14" fill="#444">4 oranges</text>

  <!-- =========================================================
       BARREL TWO  (centre x = 680)
  ========================================================= -->

  <path d="M 580,60 C 568,162 568,162 580,265
           L 780,265 C 792,162 792,162 780,60 Z"
        fill="url(#woodGrad2)" stroke="#6B4423" stroke-width="2"/>

  <!-- stave lines -->
  <line x1="612" y1="63" x2="610" y2="262" stroke="#9B5C28" stroke-width="1" opacity="0.55"/>
  <line x1="644" y1="63" x2="642" y2="262" stroke="#9B5C28" stroke-width="1" opacity="0.55"/>
  <line x1="680" y1="63" x2="680" y2="262" stroke="#9B5C28" stroke-width="1" opacity="0.55"/>
  <line x1="716" y1="63" x2="718" y2="262" stroke="#9B5C28" stroke-width="1" opacity="0.55"/>
  <line x1="748" y1="63" x2="750" y2="262" stroke="#9B5C28" stroke-width="1" opacity="0.55"/>

  <!-- metal hoops -->
  <rect x="577" y="82"  width="206" height="9" rx="1" fill="#484848"/>
  <rect x="568" y="157" width="224" height="9" rx="1" fill="#484848"/>
  <rect x="577" y="233" width="206" height="9" rx="1" fill="#484848"/>

  <!-- top rim and dark interior -->
  <ellipse cx="680" cy="60" rx="100" ry="15" fill="#9B6A35" stroke="#6B4423" stroke-width="2"/>
  <ellipse cx="680" cy="60" rx="92"  ry="12" fill="#2A1408" opacity="0.75"/>

  <!-- Fruits in Barrel Two: 4 apples + 8 oranges
       4 rows x 3 cols.  Each row: col 0 = apple, cols 1-2 = orange.
       x = 640, 680, 720  (step 40)
       y = 105, 143, 181, 219  (step 38) -->

  <!-- row 0, y=105 -->
  <circle cx="640" cy="105" r="11" fill="#CC2222" stroke="#881414" stroke-width="1" clip-path="url(#b2clip)"/>
  <line x1="640" y1="94" x2="642" y2="89" stroke="#5A3010" stroke-width="2" clip-path="url(#b2clip)"/>
  <circle cx="680" cy="105" r="11" fill="#FF8800" stroke="#CC5500" stroke-width="1" clip-path="url(#b2clip)"/>
  <circle cx="720" cy="105" r="11" fill="#FF8800" stroke="#CC5500" stroke-width="1" clip-path="url(#b2clip)"/>

  <!-- row 1, y=143 -->
  <circle cx="640" cy="143" r="11" fill="#CC2222" stroke="#881414" stroke-width="1" clip-path="url(#b2clip)"/>
  <line x1="640" y1="132" x2="642" y2="127" stroke="#5A3010" stroke-width="2" clip-path="url(#b2clip)"/>
  <circle cx="680" cy="143" r="11" fill="#FF8800" stroke="#CC5500" stroke-width="1" clip-path="url(#b2clip)"/>
  <circle cx="720" cy="143" r="11" fill="#FF8800" stroke="#CC5500" stroke-width="1" clip-path="url(#b2clip)"/>

  <!-- row 2, y=181 -->
  <circle cx="640" cy="181" r="11" fill="#CC2222" stroke="#881414" stroke-width="1" clip-path="url(#b2clip)"/>
  <line x1="640" y1="170" x2="642" y2="165" stroke="#5A3010" stroke-width="2" clip-path="url(#b2clip)"/>
  <circle cx="680" cy="181" r="11" fill="#FF8800" stroke="#CC5500" stroke-width="1" clip-path="url(#b2clip)"/>
  <circle cx="720" cy="181" r="11" fill="#FF8800" stroke="#CC5500" stroke-width="1" clip-path="url(#b2clip)"/>

  <!-- row 3, y=219 -->
  <circle cx="640" cy="219" r="11" fill="#CC2222" stroke="#881414" stroke-width="1" clip-path="url(#b2clip)"/>
  <line x1="640" y1="208" x2="642" y2="203" stroke="#5A3010" stroke-width="2" clip-path="url(#b2clip)"/>
  <circle cx="680" cy="219" r="11" fill="#FF8800" stroke="#CC5500" stroke-width="1" clip-path="url(#b2clip)"/>
  <circle cx="720" cy="219" r="11" fill="#FF8800" stroke="#CC5500" stroke-width="1" clip-path="url(#b2clip)"/>

  <!-- Barrel Two label and legend -->
  <text x="680" y="290"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="18" font-weight="bold"
        text-anchor="middle" fill="#2A2A2A">Barrel Two</text>
  <circle cx="617" cy="314" r="8" fill="#CC2222" stroke="#881414" stroke-width="1"/>
  <line x1="617" y1="306" x2="618" y2="302" stroke="#5A3010" stroke-width="2"/>
  <text x="630" y="319"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="14" fill="#444">4 apples</text>
  <circle cx="617" cy="338" r="8" fill="#FF8800" stroke="#CC5500" stroke-width="1"/>
  <text x="630" y="343"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="14" fill="#444">8 oranges</text>

  <!-- central prompt -->
  <text x="450" y="310"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="15" font-style="italic"
        text-anchor="middle" fill="#666">Choose a barrel at random,</text>
  <text x="450" y="332"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="15" font-style="italic"
        text-anchor="middle" fill="#666">then draw one fruit.</text>

</svg>
