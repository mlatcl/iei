# LaMD Configuration for VibeCourse Module
# Edit author information and GitHub settings before running maketalk.

author:
- given: ""
  family: ""
  institution: ""
  url: ""

layout: lecture
venue: ""
talktheme: white
talkcss: mlatcl.css
talkfontsize: xs
bibdir: $HOME/lawrennd/bibliography/
people: ../_people/people.yml
postsdir: ../_lectures/
slidesdir: ../slides/ # Compiled slide HTML. copy_web_diagrams writes published figures into slides/diagrams/ here
notesdir: ../_notes/
notebooksdir: ../_notebooks/
practicalsdir: ../_practicals/
snippetsdir: $HOME/lawrennd/snippets/
writediagramsdir: . # Where the build writes newly created diagrams (not the shared library)
scriptsdir: ../scripts/
diagramsdir: $HOME/lawrennd/slides/diagrams/ # Filesystem SOURCE library. copy_web_diagrams reads from here; not a URL
diagramswebpath: slides/diagrams/ # Published URL path after url+baseurl. HTML \diagramsDir uses this, not diagramsdir
slidesheader: slides-header.html

posts: True
docx: False
notespdf: False
slidespdf: False
slidesipynb: False
pptx: False
pdf: False
assignment: False
ipynb: True
reveal: True

# VIBECOURSE-GENERATED: run `./vc generate-site` to update
baseurl: "iei/"
url: "https://mlatcl.github.io/"
ghub:
- organization: mlatcl
  repository: iei
  branch: gh-pages
  directory: _lamd
# END VIBECOURSE-GENERATED
macrosdir: $HOME/lawrennd/lamd/lamd/macros
transition: None

