# Light check: build the site the same way GitHub Pages does.
# Catches invalid front matter dates, broken YAML, and Jekyll errors before merge.
name: Pages build

on:
  pull_request:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jekyll:
    name: Jekyll (github-pages)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
