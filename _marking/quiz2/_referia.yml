scored:
  field: "Total Score"

combinator:
  - field: Total Score
    liquid: >-
      {% assign t = 0 %}{% assign a = q1Score | append: "" | strip | downcase %}{% if a == "1" or a == "1.0" or a == "true" or a == "yes" %}{% assign t = t | plus: 1 %}{% endif %}{% assign a = q2Score | append: "" | strip | downcase %}{% if a == "1" or a == "1.0" or a == "true" or a == "yes" %}{% assign t = t | plus: 1 %}{% endif %}{% assign a = q3Score | append: "" | strip | downcase %}{% if a == "1" or a == "1.0" or a == "true" or a == "yes" %}{% assign t = t | plus: 1 %}{% endif %}{% assign a = q4Score | append: "" | strip | downcase %}{% if a == "1" or a == "1.0" or a == "true" or a == "yes" %}{% assign t = t | plus: 1 %}{% endif %}{% assign a = q5Score | append: "" | strip | downcase %}{% if a == "1" or a == "1.0" or a == "true" or a == "yes" %}{% assign t = t | plus: 1 %}{% endif %}{% assign a = q6Score | append: "" | strip | downcase %}{% if a == "1" or a == "1.0" or a == "true" or a == "yes" %}{% assign t = t | plus: 1 %}{% endif %}{% assign a = q7Score | append: "" | strip | downcase %}{% if a == "1" or a == "1.0" or a == "true" or a == "yes" %}{% assign t = t | plus: 1 %}{% endif %}{% assign a = q8Score | append: "" | strip | downcase %}{% if a == "1" or a == "1.0" or a == "true" or a == "yes" %}{% assign t = t | plus: 1 %}{% endif %}{% assign a = q9Score | append: "" | strip | downcase %}{% if a == "1" or a == "1.0" or a == "true" or a == "yes" %}{% assign t = t | plus: 1 %}{% endif %}{% assign a = q10Score | append: "" | strip | downcase %}{% if a == "1" or a == "1.0" or a == "true" or a == "yes" %}{% assign t = t | plus: 1 %}{% endif %}{{ t }}

localpdf:
  - directory: submissions
    name: script
    liquid: "L172_{{crsid}}_week4_quiz.pdf"
  - directory: files
    name: paper
    liquid: "L172_week4_quiz.pdf"

viewer:
  - liquid: |
      ## Quiz 2 (paper) — 2026-11-03

      Assessment: [`assessments/in-class-quiz2.md`](../../assessments/in-class-quiz2.md).
      Paper: `files/L172_week4_quiz.pdf`. **10 marks**, 1 each; no partial credit
      on multi-select. Tick **Correct** if right (answer boxes hide); if wrong,
      leave it unticked and record what they marked on the form.

  - liquid: |
      ### {{given}} {{family}} (`{{crsid}}`)

      - Degree: {{degree}}{% if candidate %} · Candidate: {{candidate}}{% endif %}
      - Script scan: `L172_{{crsid}}_week4_quiz.pdf` (under `submissions/`)
      - Running total: **{{totalScore}}** / 10

review:
  - type: Markdown
    liquid: |
      {{ preamble }}

  # —— Q1 Matching ——
  - type: Markdown
    liquid: |
      {{ q1 }}
  - type: Checkbox
    field: Q1 Score
    args:
      description: "Q1 Correct"
  - type: Markdown
    visible_if:
      field: Q1 Score
      equals: false
    liquid: |
      **Their matching letters** (blank if empty / illegible):
  - type: Dropdown
    field: Q1 Black
    visible_if:
      field: Q1 Score
      equals: false
    args:
      description: "Joseph Black →"
      options: ["", "a", "b", "c", "d"]
  - type: Dropdown
    field: Q1 Carnot
    visible_if:
      field: Q1 Score
      equals: false
    args:
      description: "Sadi Carnot →"
      options: ["", "a", "b", "c", "d"]
  - type: Dropdown
    field: Q1 Joule
    visible_if:
      field: Q1 Score
      equals: false
    args:
      description: "James Joule →"
      options: ["", "a", "b", "c", "d"]
  - type: Dropdown
    field: Q1 Rumford
    visible_if:
      field: Q1 Score
      equals: false
    args:
      description: "Count Rumford →"
      options: ["", "a", "b", "c", "d"]

  # —— Q2 Fill blank ——
  - type: Markdown
    liquid: |
      {{ q2 }}
  - type: Checkbox
    field: Q2 Score
    args:
      description: "Q2 Correct"
  - type: Text
    field: Q2 Blank
    visible_if:
      field: Q2 Score
      equals: false
    args:
      description: "Their blank (SI unit of k_B T H)"

  # —— Q3 Diff. entropy (multi-select) ——
  - type: Markdown
    liquid: |
      {{ q3 }}
  - type: Checkbox
    field: Q3 Score
    args:
      description: "Q3 Correct"
  - type: Markdown
    visible_if:
      field: Q3 Score
      equals: false
    liquid: |
      **Tick boxes they marked:**
  - type: Checkbox
    field: Q3a
    visible_if:
      field: Q3 Score
      equals: false
    args:
      description: "(a) Shannon fair-coin entropy can likewise be negative"
  - type: Checkbox
    field: Q3b
    visible_if:
      field: Q3 Score
      equals: false
    args:
      description: "(b) Differential entropy changes if the coordinate changes"
  - type: Checkbox
    field: Q3c
    visible_if:
      field: Q3 Score
      equals: false
    args:
      description: "(c) Differential entropy of a density can itself be negative"
  - type: Checkbox
    field: Q3d
    visible_if:
      field: Q3 Score
      equals: false
    args:
      description: "(d) Multiplying by k_B removes the negativity"

  # —— Q4 Hurricane ——
  - type: Markdown
    liquid: |
      {{ q4 }}
  - type: Checkbox
    field: Q4 Score
    args:
      description: "Q4 Correct"
  - type: Markdown
    visible_if:
      field: Q4 Score
      equals: false
    liquid: |
      **Tick boxes they marked:**
  - type: Checkbox
    field: Q4a
    visible_if:
      field: Q4 Score
      equals: false
    args:
      description: "(a) Hurricane already a degree of freedom in Navier–Stokes"
  - type: Checkbox
    field: Q4b
    visible_if:
      field: Q4 Score
      equals: false
    args:
      description: "(b) Named storm is a coarse-graining / macro-description"
  - type: Checkbox
    field: Q4c
    visible_if:
      field: Q4 Score
      equals: false
    args:
      description: "(c) Storm micro-state = trajectory of one air molecule"
  - type: Checkbox
    field: Q4d
    visible_if:
      field: Q4 Score
      equals: false
    args:
      description: "(d) Coarser grid discards more info, can cost less compute"

  # —— Q5 log Z ——
  - type: Markdown
    liquid: |
      {{ q5 }}
  - type: Checkbox
    field: Q5 Score
    args:
      description: "Q5 Correct"
  - type: Markdown
    visible_if:
      field: Q5 Score
      equals: false
    liquid: |
      **Tick boxes they marked:**
  - type: Checkbox
    field: Q5a
    visible_if:
      field: Q5 Score
      equals: false
    args:
      description: "(a) log Z is the inner energy U"
  - type: Checkbox
    field: Q5b
    visible_if:
      field: Q5 Score
      equals: false
    args:
      description: "(b) Up to −k_B T, log Z is available energy / work out"
  - type: Checkbox
    field: Q5c
    visible_if:
      field: Q5 Score
      equals: false
    args:
      description: "(c) Z from Summe der Zustände (sum of states)"
  - type: Checkbox
    field: Q5d
    visible_if:
      field: Q5 Score
      equals: false
    args:
      description: "(d) log Z is the information-theoretic entropy H"

  # —— Q6 H vs S ——
  - type: Markdown
    liquid: |
      {{ q6 }}
  - type: Checkbox
    field: Q6 Score
    args:
      description: "Q6 Correct"
  - type: Markdown
    visible_if:
      field: Q6 Score
      equals: false
    liquid: |
      **Tick boxes they marked:**
  - type: Checkbox
    field: Q6a
    visible_if:
      field: Q6 Score
      equals: false
    args:
      description: "(a) S = k_B H"
  - type: Checkbox
    field: Q6b
    visible_if:
      field: Q6 Score
      equals: false
    args:
      description: "(b) S = k_B T H"
  - type: Checkbox
    field: Q6c
    visible_if:
      field: Q6 Score
      equals: false
    args:
      description: "(c) H and S are the same number, including units"
  - type: Checkbox
    field: Q6d
    visible_if:
      field: Q6 Score
      equals: false
    args:
      description: "(d) k_B supplies units so S is not dimensionless"

  # —— Q7 Bernoulli ——
  - type: Markdown
    liquid: |
      {{ q7 }}
  - type: Checkbox
    field: Q7 Score
    args:
      description: "Q7 Correct"
  - type: Markdown
    visible_if:
      field: Q7 Score
      equals: false
    liquid: |
      **Tick boxes they marked:**
  - type: Checkbox
    field: Q7a
    visible_if:
      field: Q7 Score
      equals: false
    args:
      description: "(a) Heat leaks through pores as conserved caloric"
  - type: Checkbox
    field: Q7b
    visible_if:
      field: Q7 Score
      equals: false
    args:
      description: "(b) Pressure is the rate of corpuscular impacts on the wall"
  - type: Checkbox
    field: Q7c
    visible_if:
      field: Q7 Score
      equals: false
    args:
      description: "(c) Individual trajectories discarded; a swarm is summarised"
  - type: Checkbox
    field: Q7d
    visible_if:
      field: Q7 Score
      equals: false
    args:
      description: "(d) Laplace's exact curve of every molecule is tracked"

  # —— Q8 Ensemble ——
  - type: Markdown
    liquid: |
      {{ q8 }}
  - type: Checkbox
    field: Q8 Score
    args:
      description: "Q8 Correct"
  - type: Markdown
    visible_if:
      field: Q8 Score
      equals: false
    liquid: |
      **Tick boxes they marked:**
  - type: Checkbox
    field: Q8a
    visible_if:
      field: Q8 Score
      equals: false
    args:
      description: "(a) Ensemble = probability over micro-states for a macro-state"
  - type: Checkbox
    field: Q8b
    visible_if:
      field: Q8 Score
      equals: false
    args:
      description: "(b) Bernoulli already tracked Laplace's curve for every corpuscle"
  - type: Checkbox
    field: Q8c
    visible_if:
      field: Q8 Score
      equals: false
    args:
      description: "(c) Entropy of a Gaussian density depends on the mean"
  - type: Checkbox
    field: Q8d
    visible_if:
      field: Q8 Score
      equals: false
    args:
      description: "(d) Shannon H discrete/drops mechanism; Wiener continuous/does not"

  # —— Q9 Intensive / extensive ——
  - type: Markdown
    liquid: |
      {{ q9 }}
  - type: Checkbox
    field: Q9 Score
    args:
      description: "Q9 Correct"
  - type: Markdown
    visible_if:
      field: Q9 Score
      equals: false
    liquid: |
      **Tick boxes they marked:**
  - type: Checkbox
    field: Q9a
    visible_if:
      field: Q9 Score
      equals: false
    args:
      description: "(a) Temperature is intensive"
  - type: Checkbox
    field: Q9b
    visible_if:
      field: Q9 Score
      equals: false
    args:
      description: "(b) Physical entropy S is extensive"
  - type: Checkbox
    field: Q9c
    visible_if:
      field: Q9 Score
      equals: false
    args:
      description: "(c) Pressure is intensive"
  - type: Checkbox
    field: Q9d
    visible_if:
      field: Q9 Score
      equals: false
    args:
      description: "(d) Volume is intensive"
  - type: Checkbox
    field: Q9e
    visible_if:
      field: Q9 Score
      equals: false
    args:
      description: "(e) Doubling N at same T,P leaves S unchanged"

  # —— Q10 Heat thread ——
  - type: Markdown
    liquid: |
      {{ q10 }}
  - type: Checkbox
    field: Q10 Score
    args:
      description: "Q10 Correct"
  - type: Markdown
    visible_if:
      field: Q10 Score
      equals: false
    liquid: |
      **Tick boxes they marked:**
  - type: Checkbox
    field: Q10a
    visible_if:
      field: Q10 Score
      equals: false
    args:
      description: "(a) Clausius coined entropy to name uncertainty"
  - type: Checkbox
    field: Q10b
    visible_if:
      field: Q10 Score
      equals: false
    args:
      description: "(b) Clausius kept Joule + Carnot, dropped conserved heat"
  - type: Checkbox
    field: Q10c
    visible_if:
      field: Q10 Score
      equals: false
    args:
      description: "(c) Work → heat entirely; heat cannot all → work"
  - type: Checkbox
    field: Q10d
    visible_if:
      field: Q10 Score
      equals: false
    args:
      description: "(d) Joule's paddle-wheel shows caloric is conserved"
  - type: Checkbox
    field: Q10e
    visible_if:
