# Quiz 2 marking (paper multi-choice, week 4 lecture, 2026-11-03).
#
# Inherits the cohort from ../students. Tick Correct if right (hides
# answer widgets); if wrong, record matching letters / blank / ticks.
# Answer key: answer_key.yml (gitignored under _marking/**).
# Script scans: submissions/L172_<crsid>_week4_quiz.pdf
#
# Serve from this directory:
#   referia serve --root ~/mlatcl/iei/_marking/quiz2

referia_config_version: 2
strict_columns: false
title: "L172 — Quiz 2 marking"
date: 2026-11-03
week: 4
task: quiz
list_order: 42
kind: marking
current: true
author: Neil D. Lawrence
description: >
  Mark Quiz 2 (paper, 10 marks). Tick Correct if right; otherwise record
  their form answers (matching letters, fill-blank, selection ticks).
  Covers Weeks 2–3 as delivered (ensemble, heat thread, Helmholtz, H vs S).
active: True
due: 2026-11-03 12:00
browser: Google Chrome.app

inherit:
  writable: False
  directory: ../students
  ignore:
    - sortby
    - review
    - output
    - scored
    - title
    - description
    - due
    - current
    - timestamp_field
    - created_field
    - localpdf
    - combinator
    - display
    - filters
    - sort
    - constants
  append:
    - mapping
    - viewer

# Multi-select correct sets live only in answer_key.yml (gitignored).
# Review shows them via {{ q1 }}…{{ q10 }}; do not put "exactly a+b" in this file.
constants:
  type: yaml
  directory: .
  filename: answer_key.yml
  index: key

sortby:
  field: familyName
  ascending: True

timestamp_field: "Quiz 2 Timestamp"
created_field: "Quiz 2 Created"

mapping:
  q1Score: Q1 Score
  q2Score: Q2 Score
  q3Score: Q3 Score
  q4Score: Q4 Score
  q5Score: Q5 Score
  q6Score: Q6 Score
  q7Score: Q7 Score
  q8Score: Q8 Score
  q9Score: Q9 Score
  q10Score: Q10 Score
  q1Black: Q1 Black
  q1Carnot: Q1 Carnot
  q1Rumford: Q1 Rumford
  q1Joule: Q1 Joule
  q2Blank: Q2 Blank
  q3a: Q3a
