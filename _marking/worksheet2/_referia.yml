# Worksheet 2 marking — Socratic dialogue (markdown) + handwritten reflection (PDF).
#
# Inherits the cohort from ../students. Dialogues are joined from
# submissions/*_dialogue.md (frontmatter + body). Reflection scans are
# L172_<crsid>_worksheet2_reflection.pdf under submissions/.
#
# Serve from this directory:
#   referia serve --root ~/mlatcl/iei/_marking/worksheet2

referia_config_version: 2
strict_columns: false
title: "L172 — Worksheet 2 marking"
date: 2026-11-03
week: 4
task: worksheet
list_order: 40
kind: marking
current: true
author: Neil D. Lawrence
description: >
  Mark Worksheet 2: Socratic dialogue on Shannon H versus Boltzmann S
  (curiosity, skepticism) plus handwritten reflection scan. 15 marks
  total (5+5+5). Due 2026-11-03 10:00.
active: True
due: 2026-11-03 10:00
browser: Google Chrome.app
inherit:
  writable: False
  directory: ../students
  ignore:
    - sortby
    - review
    - output
    - scored
    - title
    - description
    - due
    - current
    - timestamp_field
    - created_field
    - localpdf
    - display
    - filters
    - sort
  append:
    - mapping
    - viewer

sortby:
  field: familyName
  ascending: True

timestamp_field: "Worksheet 2 Timestamp"
created_field: "Worksheet 2 Created"

mapping:
  curiosityComment: Curiosity Comment
  curiosityScore: Curiosity Score
  skepticismComment: Skepticism Comment
  skepticismScore: Skepticism Score
  reflectionComment: Reflection Comment
  reflectionScore: Reflection Score
  overallComment: Overall Comment
  llmProvider: llm_provider
  llmModel: llm_model
  llmInterface: llm_interface
  conversationDate: conversation_date
  nExchanges: n_exchanges
  dialogueContent: content

# Join submitted dialogues (left: class list stays visible if a file is missing).
# An empty submissions/ glob has no crsid column and cannot be joined — keep
# _none_dialogue.md until the first real Moodle file is copied in.
# Reflection PDFs are resolved by path, not joined, so missing scans still show.
additional:
  index: crsid
  type: markdown_directory
  how: left
  source:
    - directory: submissions
      glob: "*_dialogue.md"
  fields:
    - crsid
    - worksheet
    - title
    - llm_provider
    - llm_model
    - llm_interface
    - conversation_date
    - n_exchanges
    - content
  store_fields:
    directory: dialogueDirectory
    filename: dialogueFilename
    root: dialogueRoot

output:
  index: crsid
  type: csv
  directory: info
  filename: worksheet2_scores.csv
  header: 0
  columns:
    - Curiosity Comment
    - Curiosity Score
    - Skepticism Comment
    - Skepticism Score
    - Reflection Comment
    - Reflection Score
    - Overall Comment
    - Worksheet 2 Timestamp
    - Worksheet 2 Created
  mapping:
    curiosityComment: Curiosity Comment
    curiosityScore: Curiosity Score
    skepticismComment: Skepticism Comment
    skepticismScore: Skepticism Score
    reflectionComment: Reflection Comment
    reflectionScore: Reflection Score
    overallComment: Overall Comment

scored:
  field: "Overall Comment"

localpdf:
  - directory: submissions
    name: reflection
    liquid: "L172_{{crsid}}_worksheet2_reflection.pdf"

viewer:
  - liquid: |
      ## Worksheet 2 — Socratic dialogue on Shannon \(H\) and Boltzmann \(S\)

      Assessment: [`assessments/mini-project-worksheet2.md`](../../assessments/mini-project-worksheet2.md).
      Brief: curiosity on the \(H\)/\(S\) claim (ex. 1+), skepticism on identity
      versus metaphor (ex. 2+), handwritten reflection. **15 marks** (5 + 5 + 5).

      - **60–74%**: ten turns; mandated pair attempted; thin skepticism; reflection restates.
      - **75–79%**: clear arc to a concrete assumption (alphabet, equilibrium, what \(p\) is over); reflection names a tension.
      - **80–89%**: later probes expose a non-obvious inconsistency (differential entropy, units/\(k\), free-energy bookkeeping); reflection links to theme.
      - **90–100%**: dialogue + reflection show synthesis beyond the model’s answers.

  - liquid: |
      ### {{given}} {{family}} (`{{crsid}}`)

      - Degree: {{degree}}{% if candidate %} · Candidate: {{candidate}}{% endif %}
      - Model: {{llm_provider}} / **{{llm_model}}** ({{llm_interface}})
      - Conversation date: {{conversation_date}}
      - Exchanges declared: {{n_exchanges}}
      - Dialogue file: `{{dialogueFilename}}`
      - Reflection PDF: `L172_{{crsid}}_worksheet2_reflection.pdf`

  - liquid: |
      {% if content %}
      {{content}}
      {% else %}
      *No dialogue markdown joined for this student.*
      {% endif %}
    collapse:
      headings: [LLM]
      default: closed

review:
  - type: CriterionCommentScore
    prefix: Curiosity
    criterion: |
      #### Curiosity (5)

      Exchange 1 and later open questions invite substantive explanation of
      the \(H\)/\(S\) claim; not trivia or yes/no.
    value: 3
    min: 0
    max: 5
    step: 1
  - type: CriterionCommentScore
    prefix: Skepticism
    criterion: |
      #### Skepticism (5)

      Exchange 2 presses identity versus metaphor; later turns chase
      assumptions (alphabet, continuous limit, meaning of \(p_i\),
      equilibrium / \(Z\) / \(F=U-TS\)).
    value: 3
    min: 0
    max: 5
    step: 1
  - type: CriterionCommentScore
    prefix: Reflection
    criterion: |
      #### Reflection (5)

      Handwritten scan only. Clear learning about \(H\) versus \(S\) and the
      model’s limits; notes evolution of the LLM habit since Worksheet 1
      where relevant. Typed reflections are not accepted.
    value: 3
    min: 0
    max: 5
    step: 1
  - type: CriterionComment
    prefix: Overall
    liquid: |
      #### Overall

      Optional synthesis note (grade-band reading of the whole).
  - type: SaveButton
